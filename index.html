<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen · Biblia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════ VARIABLES & RESET ═══════════════════ */
:root{
  --bg:#0b0f14; --bg2:#111820; --bg3:#1a2332;
  --tx:#e8e2d6; --tx2:#7a8599; --tx3:#4a5568;
  --ac:#c8a04e; --ac2:#dbb75e; --ac3:rgba(200,160,78,.15);
  --bd:#1e2a3a; --bd2:#2a3a4e;
  --mark:#e05252; --note:#4e9ac8; --coll:#6bcb77;
  --radius:8px; --shadow:0 4px 24px rgba(0,0,0,.4);
  --font-ui:'Inter',-apple-system,sans-serif;
  --font-bible:'Crimson Pro',Georgia,serif;
  --fs-bible:19px;
}
[data-theme="light"]{
  --bg:#f7f5f0; --bg2:#edeae3; --bg3:#e2ddd3;
  --tx:#2c2416; --tx2:#6b6560; --tx3:#a09a90;
  --ac:#9a7a2e; --ac2:#b8923e; --ac3:rgba(154,122,46,.1);
  --bd:#d4cfc5; --bd2:#bfb8aa;
  --shadow:0 4px 24px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-ui);background:var(--bg);color:var(--tx);overflow:hidden;height:100vh}
a{color:var(--ac);text-decoration:none}
button{cursor:pointer;font-family:var(--font-ui);border:none;background:none;color:inherit}
input,select{font-family:var(--font-ui);color:var(--tx);background:var(--bg3);border:1px solid var(--bd);border-radius:var(--radius);padding:8px 12px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

/* ═══════════════════ LAYOUT ═══════════════════ */
#app{display:grid;grid-template-columns:240px 1fr 260px;grid-template-rows:56px 1fr;height:100vh;transition:grid-template-columns .3s}
#app.hide-left{grid-template-columns:0 1fr 260px}
#app.hide-right{grid-template-columns:240px 1fr 0}
#app.hide-both{grid-template-columns:0 1fr 0}
#app.hide-left.hide-right{grid-template-columns:0 1fr 0}

/* ═══════════════════ HEADER ═══════════════════ */
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--bd);z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem;letter-spacing:.04em;color:var(--ac);cursor:pointer;user-select:none;min-width:120px}
.logo svg{width:28px;height:28px}
.search-wrap{flex:1;max-width:480px;position:relative}
.search-wrap input{width:100%;padding-left:36px;background:var(--bg3);font-size:.9rem}
.search-wrap .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx2);pointer-events:none}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);max-height:320px;overflow-y:auto;z-index:100;display:none;box-shadow:var(--shadow)}
.search-results.open{display:block}
.search-results .item{padding:10px 14px;font-size:.85rem;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bd)}
.search-results .item:last-child{border:none}
.search-results .item:hover{background:var(--bg3)}
.search-results .item .ref{color:var(--ac);font-weight:600;white-space:nowrap}
.search-results .item .txt{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.header-actions select{font-size:.8rem;padding:6px 8px}
.hbtn{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;transition:background .15s}
.hbtn:hover{background:var(--bg3)}
.hbtn svg{width:18px;height:18px}
.hbtn.active{color:var(--ac)}

/* ═══════════════════ SIDEBAR IZQ ═══════════════════ */
aside.left{background:var(--bg2);border-right:1px solid var(--bd);overflow-y:auto;overflow-x:hidden;transition:width .3s;padding:12px 0}
#app.hide-left aside.left{width:0;padding:0;min-width:0;overflow:hidden}
.side-section{padding:8px 14px}
.side-section h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);margin-bottom:8px;font-weight:600}
.book-group{margin-bottom:6px}
.book-group-title{font-size:.72rem;color:var(--tx3);padding:4px 0;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.book-item{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:6px;font-size:.85rem;cursor:pointer;transition:background .12s;color:var(--tx2)}
.book-item:hover{background:var(--bg3);color:var(--tx)}
.book-item.active{background:var(--ac3);color:var(--ac);font-weight:600}
.chapter-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px}
.ch-btn{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:.72rem;background:var(--bg3);color:var(--tx2);transition:all .12s}
.ch-btn:hover{background:var(--bd2);color:var(--tx)}
.ch-btn.active{background:var(--ac);color:#0b0f14;font-weight:700}

/* ═══════════════════ MAIN ═══════════════════ */
main{overflow-y:auto;padding:24px 32px 80px;position:relative}
.chapter-header{margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.chapter-header h1{font-family:var(--font-bible);font-size:1.8rem;font-weight:600;line-height:1.2}
.chapter-header h1 span{color:var(--ac)}
.nav-btns{display:flex;gap:4px}
.nav-btns button{width:36px;height:36px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:1rem}
.nav-btns button:hover{background:var(--bg3);border-color:var(--ac)}
.verse-block{font-family:var(--font-bible);font-size:var(--fs-bible);line-height:1.75;margin-bottom:4px;position:relative;padding:2px 8px;border-radius:4px;transition:background .15s}
.verse-block:hover{background:var(--ac3)}
.verse-block.marked{border-left:3px solid var(--mark);padding-left:10px}
.verse-block.has-note{border-left:3px solid var(--note);padding-left:10px}
.verse-num{color:var(--ac);font-weight:600;font-size:.78em;vertical-align:super;margin-right:4px;cursor:pointer}
.verse-actions{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;gap:2px}
.verse-block:hover .verse-actions{display:flex}
.v-act{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;transition:background .12s}
.v-act:hover{background:var(--bd)}
.v-act.mark-on{color:var(--mark)}
.v-act.note-on{color:var(--note)}
.chapter-footer{margin-top:40px;display:flex;justify-content:space-between}
.cross-refs-box{margin-top:32px;padding:16px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius)}
.cross-refs-box h3{font-size:.8rem;color:var(--ac);margin-bottom:10px;font-weight:600}
.cross-ref-item{display:block;padding:6px 0;font-size:.85rem;color:var(--tx2);cursor:pointer;border-bottom:1px solid var(--bd);transition:color .12s}
.cross-ref-item:last-child{border:none}
.cross-ref-item:hover{color:var(--ac)}
.loading{text-align:center;padding:60px;color:var(--tx2)}
.loading .spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{text-align:center;padding:40px;color:var(--mark)}

/* ═══════════════════ SIDEBAR DER ═══════════════════ */
aside.right{background:var(--bg2);border-left:1px solid var(--bd);overflow-y:auto;transition:width .3s;padding:12px 0}
#app.hide-right aside.right{width:0;padding:0;min-width:0;overflow:hidden}
.rp-section{padding:12px 14px;border-bottom:1px solid var(--bd)}
.rp-section h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rp-section h3 .count{background:var(--bg3);padding:1px 7px;border-radius:10px;font-size:.65rem}
.mark-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:.82rem;color:var(--tx2);cursor:pointer}
.mark-item:hover{color:var(--tx)}
.mark-item .rm{opacity:0;transition:opacity .15s;color:var(--mark);font-size:.75rem}
.mark-item:hover .rm{opacity:1}
.collection-item{padding:8px 10px;background:var(--bg3);border-radius:6px;margin-bottom:6px;cursor:pointer;transition:background .12s}
.collection-item:hover{background:var(--bd)}
.collection-item h4{font-size:.82rem;font-weight:600;margin-bottom:2px}
.collection-item p{font-size:.72rem;color:var(--tx3)}
.plan-progress{height:4px;background:var(--bg3);border-radius:2px;margin:8px 0;overflow:hidden}
.plan-progress .bar{height:100%;background:var(--ac);border-radius:2px;transition:width .5s}
.plan-item{font-size:.8rem;color:var(--tx2);padding:4px 0}
.plan-item.done{color:var(--coll);text-decoration:line-through}

/* ═══════════════════ PROYECCIÓN ═══════════════════ */
#projection{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center}
#projection.open{display:flex}
#projection .proj-ref{font-family:var(--font-ui);font-size:1rem;color:rgba(255,255,255,.4);margin-bottom:24px;letter-spacing:.12em;text-transform:uppercase}
#projection .proj-text{font-family:var(--font-bible);font-size:clamp(28px,5vw,52px);line-height:1.55;color:#f0e8d8;text-align:center;max-width:85vw;font-weight:400;transition:opacity .3s}
#projection .proj-text em{color:#d4a853;font-style:normal}
#projection .proj-nav{position:absolute;bottom:40px;display:flex;gap:12px;opacity:0;transition:opacity .3s}
#projection:hover .proj-nav{opacity:1}
#projection .proj-nav button{padding:10px 22px;border-radius:var(--radius);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:.85rem;border:1px solid rgba(255,255,255,.1);transition:all .15s}
#projection .proj-nav button:hover{background:rgba(255,255,255,.15);color:#fff}
#projection .proj-close{position:absolute;top:20px;right:24px;font-size:1.5rem;color:rgba(255,255,255,.3);opacity:0;transition:opacity .3s}
#projection:hover .proj-close{opacity:1}
#projection .proj-bar{position:absolute;bottom:0;left:0;height:3px;background:rgba(255,255,255,.15)}
#projection .proj-bar .fill{height:100%;background:#d4a853;transition:width .4s}

/* ═══════════════════ MODAL NOTAS ═══════════════════ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:24px;width:min(440px,90vw);box-shadow:var(--shadow)}
.modal h3{margin-bottom:16px;font-size:1rem;color:var(--ac)}
.modal textarea{width:100%;min-height:120px;resize:vertical;font-size:.9rem;line-height:1.6;margin-bottom:16px;padding:12px}
.modal .modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal .btn{padding:8px 20px;border-radius:var(--radius);font-size:.85rem;font-weight:500;transition:all .15s}
.modal .btn-primary{background:var(--ac);color:#0b0f14}
.modal .btn-primary:hover{background:var(--ac2)}
.modal .btn-ghost{color:var(--tx2);border:1px solid var(--bd)}
.modal .btn-ghost:hover{background:var(--bg3)}
.modal .btn-danger{color:var(--mark);border:1px solid var(--mark)}

/* ═══════════════════ COMPARE ═══════════════════ */
.compare-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.compare-col{font-family:var(--font-bible);font-size:var(--fs-bible);line-height:1.75}
.compare-col h4{font-family:var(--font-ui);font-size:.75rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bd)}

/* ═══════════════════ TOAST ═══════════════════ */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--bd);padding:10px 24px;border-radius:var(--radius);font-size:.85rem;z-index:2000;transition:transform .3s;box-shadow:var(--shadow)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ═══════════════════ RESPONSIVE ═══════════════════ */
@media(max-width:900px){
  #app{grid-template-columns:1fr!important}
  aside.left,aside.right{position:fixed;top:56px;bottom:0;z-index:50;width:260px}
  aside.left{left:0;transform:translateX(-100%)}
  aside.right{right:0;transform:translateX(100%)}
  aside.left.open,aside.right.open{transform:translateX(0)}
  main{padding:16px}
}
</style>
</head>
<body>

<div id="app">
<!-- ═══════════ HEADER ═══════════ -->
<header>
  <button class="hbtn" id="btn-menu-left" title="Panel de libros">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <div class="logo" onclick="navigateTo('juan',3,16)">
    <svg viewBox="0 0 32 32" fill="none"><path d="M16 2L4 10v12l12 8 12-8V10L16 2z" stroke="var(--ac)" stroke-width="1.5" fill="none"/><path d="M16 8l-7 4.5v9L16 26l7-4.5v-9L16 8z" fill="var(--ac)" opacity=".25"/><path d="M12 14h8M12 17h6" stroke="var(--ac)" stroke-width="1.2" stroke-linecap="round"/></svg>
    LUMEN
  </div>
  <div class="search-wrap">
    <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
    <input type="text" id="search-input" placeholder="Buscar: Juan 3:16  ·  o palabra…" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="header-actions">
    <select id="sel-translation" title="Traducción">
      <option value="rvg1995">RVR 1995</option>
      <option value="rvg1960">RVR 1960</option>
      <option value="tla">TLA</option>
      <option value="b16">Biblia 16</option>
      <option value="b17">Biblia 17</option>
    </select>
    <button class="hbtn" id="btn-fs-dec" title="A−">A−</button>
    <button class="hbtn" id="btn-fs-inc" title="A+">A+</button>
    <button class="hbtn" id="btn-compare" title="Comparar traducciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>
    </button>
    <button class="hbtn" id="btn-project" title="Proyectar (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
    </button>
    <button class="hbtn" id="btn-theme" title="Tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="hbtn" id="btn-menu-right" title="Panel lateral">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v18h-6M9 3H3v18h6M3 8h6M3 12h6M3 16h6"/></svg>
    </button>
  </div>
</header>

<!-- ═══════════ SIDEBAR IZQ ═══════════ -->
<aside class="left" id="sidebar-left">
  <div class="side-section">
    <h3>Antiguo Testamento</h3>
    <div id="ot-books"></div>
  </div>
  <div class="side-section">
    <h3>Nuevo Testamento</h3>
    <div id="nt-books"></div>
  </div>
  <div class="side-section" id="chapter-section">
    <h3 id="ch-title">Capítulos</h3>
    <div class="chapter-grid" id="chapter-grid"></div>
  </div>
</aside>

<!-- ═══════════ MAIN ═══════════ -->
<main id="main">
  <div class="chapter-header">
    <h1 id="ch-heading"><span id="ch-book">Juan</span> <span id="ch-num">3</span></h1>
    <div class="nav-btns">
      <button id="btn-prev" title="Anterior (←)">←</button>
      <button id="btn-next" title="Siguiente (→)">→</button>
    </div>
  </div>
  <div id="verses-container">
    <div class="loading"><div class="spinner"></div>Cargando…</div>
  </div>
  <div id="cross-refs-container"></div>
  <div class="chapter-footer">
    <button class="nav-btns" id="btn-prev2"><button>←</button></button>
    <button class="nav-btns" id="btn-next2"><button>→</button></button>
  </div>
</main>

<!-- ═══════════ SIDEBAR DER ═══════════ -->
<aside class="right" id="sidebar-right">
  <div class="rp-section">
    <h3>Marcados <span class="count" id="mark-count">0</span></h3>
    <div id="marks-list"><p style="font-size:.8rem;color:var(--tx3)">Sin marcas todavía</p></div>
  </div>
  <div class="rp-section">
    <h3>Colecciones <span class="count" id="coll-count">0</span></h3>
    <div id="collections-list"></div>
    <button onclick="openCollectionModal()" style="margin-top:8px;font-size:.78rem;color:var(--ac);display:block;width:100%;text-align:left;padding:4px 0">＋ Nueva colección</button>
  </div>
  <div class="rp-section">
    <h3>Plan de lectura</h3>
    <div id="plan-display">
      <p style="font-size:.8rem;color:var(--tx3)">Sin plan activo</p>
    </div>
    <div id="plan-select" style="margin-top:8px;display:flex;flex-direction:column;gap:4px">
      <button class="btn-plan" data-plan="1year" style="font-size:.78rem;padding:6px 10px;background:var(--bg3);border-radius:6px;text-align:left">📖 1 año</button>
      <button class="btn-plan" data-plan="gospels" style="font-size:.78rem;padding:6px 10px;background:var(--bg3);border-radius:6px;text-align:left">✝ Evangelios</button>
      <button class="btn-plan" data-plan="psalms" style="font-size:.78rem;padding:6px 10px;background:var(--bg3);border-radius:6px;text-align:left">🎵 Salmos</button>
      <button class="btn-plan" data-plan="epistles" style="font-size:.78rem;padding:6px 10px;background:var(--bg3);border-radius:6px;text-align:left">📜 Epístolas</button>
    </div>
  </div>
</aside>
</div>

<!-- ═══════════ PROYECCIÓN ═══════════ -->
<div id="projection">
  <button class="proj-close" onclick="closeProjection()">✕</button>
  <div class="proj-ref" id="proj-ref"></div>
  <div class="proj-text" id="proj-text"></div>
  <div class="proj-nav">
    <button onclick="projNav(-1)">← Anterior</button>
    <button onclick="toggleProjectionPause()">⏸ / ▶</button>
    <button onclick="projNav(1)">Siguiente →</button>
    <button onclick="closeProjection()" style="background:rgba(255,100,100,.15);border-color:rgba(255,100,100,.3)">✕ Cerrar</button>
  </div>
  <div class="proj-bar"><div class="fill" id="proj-fill"></div></div>
</div>

<!-- ═══════════ MODAL NOTA ═══════════ -->
<div class="modal-overlay" id="note-modal">
  <div class="modal">
    <h3 id="note-title">Nota</h3>
    <textarea id="note-text" placeholder="Escribe tu nota…"></textarea>
    <div class="modal-btns">
      <button class="btn btn-danger" id="btn-del-note" style="display:none">Eliminar</button>
      <button class="btn btn-ghost" onclick="closeModal('note-modal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveNote()">Guardar</button>
    </div>
  </div>
</div>

<!-- ═══════════ MODAL COLECCIÓN ═══════════ -->
<div class="modal-overlay" id="coll-modal">
  <div class="modal">
    <h3 id="coll-title">Nueva colección</h3>
    <input type="text" id="coll-name" placeholder="Nombre de la colección" style="width:100%;margin-bottom:12px;font-size:.9rem">
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('coll-modal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCollection()">Crear</button>
    </div>
  </div>
</div>

<!-- ═══════════ TOAST ═══════════ -->
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   DATOS
═══════════════════════════════════════════ */
const BOOKS=[
{n:"Génesis",a:"genesis",c:50,t:0},{n:"Éxodo",a:"exodus",c:40,t:0},
{n:"Levítico",a:"leviticus",c:27,t:0},{n:"Números",a:"numbers",c:36,t:0},

/* ═══════════════════════════════════════════
   UTILIDADES
═══════════════════════════════════════════ */
function bookByApi(a){return BOOKS.find(b=>b.a===a)||BOOKS[40]}
function bookByName(n){return BOOKS.find(b=>b.n.toLowerCase()===n.toLowerCase())||null}
function verseRef(bk,ch,v){return bk+" "+ch+":"+v}
function verseKey(bk,ch,v){return verseRef(bk,ch,v).toLowerCase()}

function parseVerses(text){
  if(!text)return[];
  const re=/(\d{1,3})\s+/g;
  const verses=[];
  let lastPos=0,m;
  while((m=re.exec(text))!==null){
    const num=parseInt(m[1]);
    if(num===0)continue;
    const between=text.slice(lastPos,m.index).trim();
    if(between&&verses.length){
      verses[verses.length-1].text+=" "+between;
    }
    lastPos=m.index+m[0].length;
    verses.push({num,text:""});
  }
  const tail=text.slice(lastPos).trim();
  if(tail&&verses.length)verses[verses.length-1].text+=tail;
  return verses;
}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

function closeModal(id){document.getElementById(id).classList.remove("open")}

/* ═══════════════════════════════════════════
   API
═══════════════════════════════════════════ */
async function fetchChapter(book,ch,trans){
  const key=book+"|"+ch+"|"+trans;
  if(S.cache[key])return S.cache[key];
  const url=`https://bible-api.com/${book}+${ch}?translation=${trans}`;
  const res=await fetch(url);
  if(!res.ok)throw new Error("API error "+res.status);
  const data=await res.json();
  const verses=parseVerses(data.text);
  S.cache[key]=verses;
  if(Object.keys(S.cache).length>30){
    const keys=Object.keys(S.cache);
    delete S.cache[keys[0]];
  }
  S.lastChapter={book,ch,trans,verses};
  save();
  return verses;
}

function renderBookList(){
  const ot=document.getElementById("ot-books");
  const nt=document.getElementById("nt-books");
  ot.innerHTML="";nt.innerHTML="";
  BOOKS.forEach((b,i)=>{
    const el=document.createElement("div");
    el.className="book-item"+(b.a===S.book?" active":"");
    el.innerHTML=`<span>${b.n}</span><span style="font-size:.7rem;color:var(--tx3)">${b.c}</span>`;
    el.onclick=()=>{S.chapter=1;loadChapter();};
    (b.t===0?ot:nt).appendChild(el);
  });
}

function renderChapters(){
  const bk=bookByApi(S.book);
  document.getElementById("ch-title").textContent=bk.n;
  const grid=document.getElementById("chapter-grid");
  grid.innerHTML="";
  for(let c=1;c<=bk.c;c++){
    const btn=document.createElement("button");
    btn.className="ch-btn"+(c===S.chapter?" active":"");
    btn.textContent=c;
    btn.onclick=()=>{S.chapter=c;loadChapter();};
    grid.appendChild(btn);
  }
}

async function renderChapter(){
  const bk=bookByApi(S.book);
  document.getElementById("ch-book").textContent=bk.n;
  document.getElementById("ch-num").textContent=S.chapter;
  const c=document.getElementById("verses-container");
  c.innerHTML='<div class="loading"><div class="spinner"></div>Cargando…</div>';

  try{
    if(S.comparing){
      const [v1,v2]=await Promise.all([
        fetchChapter(S.book,S.chapter,S.translation),
        fetchChapter(S.book,S.chapter,altTranslation())
      ]);
      c.innerHTML=`<div class="compare-wrap">
        <div class="compare-col"><h4>${transName(S.translation)}</h4>${renderVerseHTML(v1,S.translation)}</div>
        <div class="compare-col"><h4>${transName(altTranslation())}</h4>${renderVerseHTML(v2,altTranslation())}</div>
      </div>`;
    }else{
      const verses=await fetchChapter(S.book,S.chapter,S.translation);
      c.innerHTML=renderVerseHTML(verses,S.translation);
      bindVerseActions();
    }
    renderCrossRefs();
  }catch(e){
    if(S.lastChapter&&S.lastChapter.book===S.book&&S.lastChapter.ch===S.chapter){
      c.innerHTML=renderVerseHTML(S.lastChapter.verses,S.lastChapter.trans);
      c.innerHTML+='<div style="text-align:center;padding:12px;font-size:.8rem;color:var(--tx3)">⚠ Sin conexión — mostrando último capítulo guardado</div>';
    }else{
      c.innerHTML='<div class="error-msg"><p style="font-size:1.1rem;margin-bottom:8px">⚠ Error al cargar</p><p style="font-size:.85rem">'+e.message+'</p><p style="font-size:.8rem;margin-top:8px;color:var(--tx3)">Verifica tu conexión a internet.</p></div>';
    }
  }
  renderBookList();
  renderChapters();
}

function renderVerseHTML(verses,trans){
  return verses.map(v=>{
    const key=verseKey(S.book,S.chapter,v.num);
    const marked=S.marks.includes(key);
    const hasNote=S.notes[key];
    return `<div class="verse-block${marked?" marked":""}${hasNote?" has-note":""}" data-v="${v.num}" data-key="${key}">
      <span class="verse-num">${v.num}</span>${v.text}
      <div class="verse-actions">
        <button class="v-act${marked?" mark-on":""}" data-act="mark" title="Marcar">★</button>
        <button class="v-act${hasNote?" note-on":""}" data-act="note" title="Nota">✎</button>
        <button class="v-act" data-act="share" title="Copiar">⎘</button>
        <button class="v-act" data-act="coll" title="Colección">📁</button>
      </div>
    </div>`;
  }).join("");
}

function bindVerseActions(){
  document.querySelectorAll(".verse-block").forEach(el=>{
    const v=parseInt(el.dataset.v);
    const key=el.dataset.key;
    el.querySelectorAll(".v-act").forEach(btn=>{
      btn.addEventListener("click",e=>{
        e.stopPropagation();
        const act=btn.dataset.act;
        if(act==="mark")toggleMark(key);
        if(act==="note")openNote(key,v);
        if(act==="share")shareVerse(key,v);
        if(act==="coll")openCollPicker(key,v);
      });
    });
    el.addEventListener("click",()=>{
      const main=document.getElementById("main");
      el.scrollIntoView({behavior:"smooth",block:"center"});
    });
  });
}

function renderCrossRefs(){
  const bk=bookByApi(S.book);
  const container=document.getElementById("cross-refs-container");
  let html="";
  const verses=container.dataset.verses||"";
  // Check cross-refs for the current chapter
  const chapterRefs=[];
  for(const key in CROSS_REFS){
    const parts=key.split(/\s+/);
    if(parts[0]===S.book&&parseInt(parts[1].split(":")[0])===S.chapter){
      chapterRefs.push({key,refs:CROSS_REFS[key]});
    }
  }
  if(chapterRefs.length){
    html='<div class="cross-refs-box"><h3>✦ Referencias cruzadas de este capítulo</h3>';
    chapterRefs.forEach(({key,refs})=>{
      const vn=key.split(":")[1]||"1";
      html+=`<div style="margin-bottom:8px"><span style="color:var(--ac);font-size:.82rem;font-weight:600">${bk.n} ${S.chapter}:${vn}</span> `;
      refs.forEach(r=>{
        html+=`<span class="cross-ref-item" data-ref="${r.r}">${r.r} <em style="color:var(--tx3);font-size:.75em">${r.n}</em></span>`;
      });
      html+="</div>";
    });
    html+="</div>";
    container.innerHTML=html;
    container.querySelectorAll(".cross-ref-item").forEach(el=>{
      el.onclick=()=>{
        const ref=el.dataset.ref.split(/\s+/);
        const bk2=bookByName(ref[0]);
        if(bk2){
          const chV=ref[1].split(":");
          S.book=bk2.a;S.chapter=parseInt(chV[0]);S.verse=parseInt(chV[1]||1);
          loadChapter();
        }
      };
    });
  }else{
    container.innerHTML="";
  }
}

function renderMarks(){
  const el=document.getElementById("marks-list");
  const count=document.getElementById("mark-count");
  count.textContent=S.marks.length;
  if(!S.marks.length){el.innerHTML='<p style="font-size:.8rem;color:var(--tx3)">Sin marcas</p>';return;}
  el.innerHTML=S.marks.map(m=>`<div class="mark-item" data-ref="${m}"><span>${m}</span><span class="rm" data-rm="${m}">✕</span></div>`).join("");
  el.querySelectorAll(".mark-item").forEach(item=>{
    item.onclick=e=>{
      if(e.target.classList.contains("rm"))return;
      const parts=item.dataset.ref.split(/\s+/);
      const bk=bookByName(parts[0]);
      if(bk){const cv=parts[1].split(":");S.book=bk.a;S.chapter=parseInt(cv[0]);S.verse=parseInt(cv[1]||1);loadChapter();}
    };
    const rm=item.querySelector(".rm");
    if(rm)rm.onclick=e=>{e.stopPropagation();toggleMark(rm.dataset.rm);};
  });
}

function renderCollections(){
  const el=document.getElementById("collections-list");
  const count=document.getElementById("coll-count");
  count.textContent=S.collections.length;
  if(!S.collections.length){el.innerHTML='<p style="font-size:.8rem;color:var(--tx3)">Sin colecciones</p>';return;}
  el.innerHTML=S.collections.map((c,i)=>`<div class="collection-item" data-i="${i}"><h4>${c.name}</h4><p>${c.verses.length} versículo(s)</p></div>`).join("");
  el.querySelectorAll(".collection-item").forEach(item=>{
    item.onclick=()=>{
      const c=S.collections[parseInt(item.dataset.i)];
      const cEl=document.getElementById("collections-list");
      cEl.innerHTML='<p style="font-size:.8rem;color:var(--ac);margin-bottom:8px">'+c.name+'</p>'+
        c.verses.map(v=>'<div class="mark-item" data-ref="'+v+'"><span>'+v+'</span></div>').join("")+
        '<button style="margin-top:8px;font-size:.78rem;color:var(--tx2)" onclick="renderCollections()">← Volver</button>';
    };
  });
}

function renderPlan(){
  const el=document.getElementById("plan-display");
  if(!S.plan.active){el.innerHTML='<p style="font-size:.8rem;color:var(--tx3)">Sin plan activo</p>';return;}
  const plan=PLANS[S.plan.active];
  const steps=plan.steps();
  const done=steps.filter((s,i)=>S.plan.progress[i]).length;
  const pct=Math.round(done/steps.length*100);
  let html=`<p style="font-size:.82rem;font-weight:600;margin-bottom:4px">${plan.name}</p>`;
  html+=`<div class="plan-progress"><div class="bar" style="width:${pct}%"></div></div>`;
  html+=`<p style="font-size:.75rem;color:var(--tx3)">${done}/${steps.length} · ${pct}%</p>`;
  const nextIdx=steps.findIndex((s,i)=>!S.plan.progress[i]);
  if(nextIdx>=0){
    const next=steps[nextIdx];
    const bk=bookByApi(next.book);
    html+=`<p style="font-size:.8rem;color:var(--ac);margin-top:6px">→ ${bk.n} ${next.ch}</p>`;
  }else{
    html+=`<p style="font-size:.8rem;color:var(--coll);margin-top:6px">✓ ¡Completado!</p>`;
  }
  el.innerHTML=html;
}

function transName(t){
  const m={rvg1995:"RVR 1995",rvg1960:"RVR 1960",tla:"TLA",b16:"Biblia 16",b17:"Biblia 17"};
  return m[t]||t;
}
function altTranslation(){
  const t=S.translation==="rvg1995"?"rvg1960":"rvg1995";
  return t;
}

/* ═══════════════════════════════════════════
   NAVEGACIÓN
═══════════════════════════════════════════ */
function navigateTo(bookName,ch,v){
  const bk=bookByName(bookName);
  if(!bk)return;
  S.book=bk.a;S.chapter=ch;S.verse=v||0;
  loadChapter();
}

function loadChapter(){
  S.comparing=false;
  renderChapter();
  save();
}

function goPrev(){
  const bk=bookByApi(S.book);
  if(S.chapter>1){S.chapter--;loadChapter();}
  else{
    const idx=BOOKS.findIndex(b=>b.a===S.book);
    if(idx>0){S.book=BOOKS[idx-1].a;S.chapter=BOOKS[idx-1].c;loadChapter();}
  }
}

function goNext(){
  const bk=bookByApi(S.book);
  if(S.chapter<bk.c){S.chapter++;loadChapter();}
  else{
    const idx=BOOKS.findIndex(b=>b.a===S.book);
    if(idx<BOOKS.length-1){S.book=BOOKS[idx+1].a;S.chapter=1;loadChapter();}
  }
}

/* ═══════════════════════════════════════════
   MARCAS / NOTAS / COLECCIONES
═══════════════════════════════════════════ */
function toggleMark(key){
  const i=S.marks.indexOf(key);
  if(i>=0)S.marks.splice(i,1);else S.marks.push(key);
  save();renderMarks();renderChapter();
  toast(i>=0?"Marca eliminada":"✦ Marcado");
}

let noteKey="";
function openNote(key,v){
  noteKey=key;
  document.getElementById("note-title").textContent="Nota — "+key;
  document.getElementById("note-text").value=S.notes[key]||"";
  document.getElementById("btn-del-note").style.display=S.notes[key]?"inline":"none";
  document.getElementById("note-modal").classList.add("open");
  setTimeout(()=>document.getElementById("note-text").focus(),100);
}

function saveNote(){
  const txt=document.getElementById("note-text").value.trim();
  if(txt)S.notes[noteKey]=txt;else delete S.notes[noteKey];
  save();closeModal("note-modal");renderChapter();
  toast(txt?"✎ Nota guardada":"Nota eliminada");
}

document.getElementById("btn-del-note").onclick=()=>{
  delete S.notes[noteKey];save();closeModal("note-modal");renderChapter();toast("Nota eliminada");
};

function openCollectionModal(){
  document.getElementById("coll-title").textContent="Nueva colección";
  document.getElementById("coll-name").value="";
  document.getElementById("coll-modal").classList.add("open");
  setTimeout(()=>document.getElementById("coll-name").focus(),100);
}

function saveCollection(){
  const name=document.getElementById("coll-name").value.trim();
  if(!name)return;
  S.collections.push({name,verses:[]});
  save();closeModal("coll-modal");renderCollections();toast("📁 Colección creada");
}

function openCollPicker(key,v){
  const opts=S.collections.map((c,i)=>c.name).join("\n")||"Sin colecciones";
  const choice=prompt("¿A qué colección agregar\n"+key+"?\n\n"+(S.collections.length?opts:"(Crea una primero)"));
  if(!choice)return;
  const c=S.collections.find(x=>x.name.toLowerCase()===choice.toLowerCase());
  if(c&&!c.verses.includes(key)){c.verses.push(key);save();renderCollections();toast("📁 Agregado a "+c.name);}
  else toast("Ya estaba en esa colección");
}

function shareVerse(key,v){
  const bk=bookByApi(S.book);
  const text=S.lastChapter?.verses?.find(x=>x.num===v)?.text||"";
  const full=bk.n+" "+S.chapter+":"+v+" — "+text;
  navigator.clipboard.writeText(full).then(()=>toast("⎘ Copiado al portapapeles"));
}

/* ═══════════════════════════════════════════
   BÚSQUEDA
═══════════════════════════════════════════ */
let searchTimer;
document.getElementById("search-input").addEventListener("input",e=>{
  clearTimeout(searchTimer);
  const q=e.target.value.trim();
  const results=document.getElementById("search-results");
  if(!q||q.length<2){results.classList.remove("open");return;}
  searchTimer=setTimeout(()=>doSearch(q),300);
});

async function doSearch(q){
  const results=document.getElementById("search-results");
  const ql=q.toLowerCase();

  // 1) Reference match: "juan 3:16"
  const refMatch=q.match(/^(\w+[\w\s]*?)\s+(\d{1,3})(?::(\d{1,3}))?$/);
  if(refMatch){
    const bk=bookByName(refMatch[1]);
    if(bk){
      const ch=parseInt(refMatch[2]);
      const v=refMatch[3]?parseInt(refMatch[3]):null;
      results.innerHTML=`<div class="item" onclick="navigateTo('${bk.a}',${ch}${v?", "+v:""});this.parentElement.classList.remove('open')"><span class="ref">${bk.n} ${ch}${v?":"+v":""}</span><span class="txt">Ir directo</span></div>`;
      results.classList.add("open");
      return;
    }
  }

  // 2) Search in current chapter
  const bk=bookByApi(S.book);
  try{
    const verses=await fetchChapter(S.book,S.chapter,S.translation);
    const found=verses.filter(v=>v.text.toLowerCase().includes(ql));
    if(found.length){
      results.innerHTML=found.map(v=>`<div class="item" onclick="document.querySelector('[data-v=${v.num}]')?.scrollIntoView({behavior:'smooth',block:'center'});this.parentElement.classList.remove('open')"><span class="ref">${bk.n} ${S.chapter}:${v.num}</span><span class="txt">${v.text.substring(0,60)}…</span></div>`).join("");
      results.classList.add("open");
      return;
    }
  }catch(e){}

  // 3) Cross-ref search
  const refResults=Object.entries(CROSS_REFS).filter(([k])=>k.includes(ql));
  if(refResults.length){
    results.innerHTML=refResults.slice(0,8).map(([k,refs])=>`<div class="item" onclick="this.parentElement.classList.remove('open')"><span class="ref">${k}</span><span class="txt">${refs.length} ref(s) cruzada(s)</span></div>`).join("");
    results.classList.add("open");
    return;
  }

  results.innerHTML='<div class="item"><span class="txt" style="color:var(--tx3)">Sin resultados en este contexto</span></div>';
  results.classList.add("open");
}

document.addEventListener("click",e=>{
  if(!e.target.closest(".search-wrap"))document.getElementById("search-results").classList.remove("open");
});

/* ═══════════════════════════════════════════
   PROYECCIÓN
═══════════════════════════════════════════ */
function openProjection(){
  const ov=document.getElementById("projection");
  ov.classList.add("open");
  document.getElementById("projection").requestFullscreen?.();
  const bk=bookByApi(S.book);
  let verses=[];
  if(S.lastChapter&&S.lastChapter.book===S.book&&S.lastChapter.ch===S.chapter){
    verses=S.lastChapter.verses;
  }else{
    try{
      const c=document.getElementById("verses-container");
      // parse from DOM
      verses=Array.from(c.querySelectorAll(".verse-block")).map(el=>({
        num:parseInt(el.dataset.v),
        text:el.textContent.replace(/^\d+/,"").trim()
      }));
    }catch(e){}
  }
  if(!verses.length)verses=[{num:1,text:"(Carga un capítulo primero)"}];
  S.projVerses=verses;
  S.projIdx=Math.max(0,verses.findIndex(v=>v.num===S.verse)-1)||0;
  S.projPaused=false;
  showProjVerse();
  startProjAuto();
}

function showProjVerse(){
  const v=S.projVerses[S.projIdx];
  if(!v)return;
  const bk=bookByApi(S.book);
  document.getElementById("proj-ref").textContent=bk.n+" "+S.chapter+":"+v.num;
  document.getElementById("proj-text").textContent="« "+v.text+" »";
  document.getElementById("proj-fill").style.width=((S.projIdx+1)/S.projVerses.length*100)+"%";
  S.verse=v.num;
}

function projNav(d){
  S.projIdx+=d;
  if(S.projIdx<0)S.projIdx=0;
  if(S.projIdx>=S.projVerses.length)S.projIdx=S.projVerses.length-1;
  showProjVerse();
}

function toggleProjectionPause(){S.projPaused=!S.projPaused;startProjAuto();}

function startProjAuto(){
  clearInterval(S.projTimer);
  if(!S.projPaused)S.projTimer=setInterval(()=>{
    if(S.projIdx<S.projVerses.length-1){S.projIdx++;showProjVerse();}
    else{clearInterval(S.projTimer);S.projPaused=true;}
  },8000);
}

function closeProjection(){
  document.getElementById("projection").classList.remove("open");
  document.exitFullscreen?.();
  clearInterval(S.projTimer);
}

/* ═══════════════════════════════════════════
   TEMAS / FUENTE
═══════════════════════════════════════════ */
function toggleTheme(){
  S.theme=S.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=S.theme;
  save();
}

function changeFontSize(d){
  S.fontSize=Math.max(14,Math.min(28,S.fontSize+d));
  document.documentElement.style.setProperty("--fs-bible",S.fontSize+"px");
  save();
}

/* ═══════════════════════════════════════════
   PLAN DE LECTURA
═══════════════════════════════════════════ */
function startPlan(planId){
  S.plan={active:planId,progress:{},day:0};
  save();renderPlan();toast("📖 Plan iniciado: "+PLANS[planId].name);
}

function completePlanDay(){
  const plan=PLANS[S.plan.active];
  if(!plan)return;
  const steps=plan.steps();
  S.plan.progress[S.plan.day]=Date.now();
  S.plan.day++;
  save();renderPlan();
  if(S.plan.day<steps.length){
    const next=steps[S.plan.day];
    const bk=bookByApi(next.book);
    S.book=next.book;S.chapter=next.ch;
    loadChapter();
    toast("✓ Día "+S.plan.day+" completado → "+bk.n+" "+next.ch);
  }else{
    toast("🎉 ¡Plan completado!");
  }
}

/* ═══════════════════════════════════════════
   ATAJOS DE TECLADO
═══════════════════════════════════════════ */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  const pk=document.getElementById("projection").classList.contains("open");
  switch(e.key){
    case"ArrowLeft":pk?projNav(-1):goPrev();break;
    case"ArrowRight":pk?projNav(1):goNext();break;
    case"/":e.preventDefault();document.getElementById("search-input").focus();break;
    case"f":case"F":pk?closeProjection():openProjection();break;
    case"Escape":
      if(pk)closeProjection();
      else{
        document.getElementById("note-modal").classList.remove("open");
        document.getElementById("coll-modal").classList.remove("open");
        document.getElementById("search-results").classList.remove("open");
      }
      break;
    case" ":if(pk){e.preventDefault();toggleProjectionPause();}break;
  }
});

/* ═══════════════════════════════════════════
   EVENTOS
═══════════════════════════════════════════ */
document.getElementById("btn-prev").onclick=goPrev;
document.getElementById("btn-next").onclick=goNext;
document.getElementById("btn-theme").onclick=toggleTheme;
document.getElementById("btn-fs-inc").onclick=()=>changeFontSize(2);
document.getElementById("btn-fs-dec").onclick=()=>changeFontSize(-2);
document.getElementById("btn-project").onclick=openProjection;
document.getElementById("btn-menu-left").onclick=()=>{
  const app=document.getElementById("app");
  app.classList.toggle("hide-left");
  if(window.innerWidth<=900)document.getElementById("sidebar-left").classList.toggle("open");
};
document.getElementById("btn-menu-right").onclick=()=>{
  const app=document.getElementById("app");
  app.classList.toggle("hide-right");
  if(window.innerWidth<=900)document.getElementById("sidebar-right").classList.toggle("open");
};
document.getElementById("btn-compare").onclick=function(){
  S.comparing=!S.comparing;
  this.classList.toggle("active",S.comparing);
  renderChapter();
};
document.getElementById("sel-translation").onchange=function(){
  S.translation=this.value;save();renderChapter();
};
document.querySelectorAll(".btn-plan").forEach(btn=>{
  btn.onclick=()=>startPlan(btn.dataset.plan);
});

// Complete plan day button (add to chapter header)
function addPlanCompleteBtn(){
  const navDiv=document.querySelector(".nav-btns");
  if(navDiv.querySelector("#btn-complete-day"))return;
  if(S.plan.active){
    const btn=document.createElement("button");
    btn.id="btn-complete-day";
    btn.title="Completar día del plan";
    btn.textContent="✓";
    btn.style.background="var(--coll)";
    btn.style.color="#0b0f14";
    btn.onclick=completePlanDay;
    navDiv.appendChild(btn);
  }
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
load();
document.documentElement.dataset.theme=S.theme;
document.documentElement.style.setProperty("--fs-bible",S.fontSize+"px");
document.getElementById("sel-translation").value=S.translation;

renderBookList();
renderChapters();
renderMarks();
renderCollections();
renderPlan();
addPlanCompleteBtn();
renderChapter();

// Intercept renderChapter to add plan button
const _rc=renderChapter;
renderChapter=async function(){
  await _rc();
  addPlanCompleteBtn();
};
</script>
